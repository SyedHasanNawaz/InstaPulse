<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - InstaPulse</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bg-main-gradient {
            background: linear-gradient(to right, #a855f7, #ec4899, #f97316);
        }
        .text-main-gradient {
            background: linear-gradient(to right, #a855f7, #ec4899, #f97316);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .icon-gradient {
            background: linear-gradient(135deg, #a855f7, #ec4899);
        }
        .card-shadow {
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body class="bg-main-gradient flex items-center justify-center min-h-screen p-4">

    <!-- Card -->
    <div class="bg-white p-10 rounded-[1.5rem] card-shadow w-full max-w-[420px]">
        
        <!-- Header -->
        <div class="flex flex-col items-center mb-8">
            <div class="flex items-center space-x-2 mb-4">
                <div class="w-[38px] h-[38px] rounded-xl icon-gradient flex items-center justify-center">
                    <i class="fas fa-bolt text-white text-lg"></i>
                </div>
                <h1 class="text-[26px] font-bold tracking-tight text-main-gradient">InstaPulse</h1>
            </div>
            <p class="text-gray-700 font-bold text-[17px]">Welcome back</p>
        </div>

        <!-- Form -->
        <form id="loginForm" class="space-y-5" novalidate>
            <div>
                <label class="block text-[13px] font-bold text-gray-700 mb-1.5">Email</label>
                <input type="email" id="email" required
                       class="w-full bg-[#f4f5f7] border border-transparent focus:border-purple-400 focus:bg-white focus:ring-4 focus:ring-purple-100 rounded-xl px-4 py-3 outline-none transition-all duration-200 text-sm text-gray-800 placeholder-gray-400" 
                       placeholder="you@example.com">
                <p id="emailError" class="text-red-500 text-xs mt-1.5 hidden font-bold">Please enter a valid email.</p>
            </div>

            <div>
                <label class="block text-[13px] font-bold text-gray-700 mb-1.5">Password</label>
                <input type="password" id="password" required
                       class="w-full bg-[#f4f5f7] border border-transparent focus:border-purple-400 focus:bg-white focus:ring-4 focus:ring-purple-100 rounded-xl px-4 py-3 outline-none transition-all duration-200 text-sm text-gray-800 placeholder-gray-400" 
                       placeholder="........">
                <p id="passwordError" class="text-red-500 text-xs mt-1.5 hidden font-bold">Password cannot be empty.</p>
            </div>

            <button type="submit" 
                    class="w-full bg-main-gradient text-white font-bold text-[15px] rounded-xl py-3.5 mt-2 shadow-lg shadow-pink-500/20 hover:shadow-pink-500/40 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-pink-200">
                Sign In
            </button>
        </form>

        <!-- Footer -->
        <div class="text-center mt-8">
            <p class="text-[13px] text-gray-600 font-semibold">
                Don't have an account? 
                <a href="signup.html" class="font-bold text-gray-800 hover:text-purple-600 transition-colors">Create one</a>
            </p>
        </div>

    </div>

    <script src="js/validation.js"></script>
</body>
</html>
